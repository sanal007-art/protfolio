name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          # Value is your OpenRouter key (sk-or-v1-...)
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: |
            Review this pull request for a portfolio site (HTML, CSS, JavaScript).
            Focus on:
            1. Security (hardcoded secrets, XSS, unsafe innerHTML, leaking form data)
            2. Missing null checks / runtime crashes
            3. Accessibility and placeholder links (href="#")
            For each finding: file, severity (critical/high/medium/low), short explanation, suggested fix.
          claude_args: |
            --max-turns 10
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          # Swap this for the exact free model ID you want, e.g.:
          # deepseek/deepseek-chat-v3.1:free
          # meta-llama/llama-3.3-70b-instruct:free
          # z-ai/glm-4.5-air:free
          ANTHROPIC_MODEL: deepseek/deepseek-chat-v3.1:free
          ANTHROPIC_SMALL_FAST_MODEL: deepseek/deepseek-chat-v3.1:free

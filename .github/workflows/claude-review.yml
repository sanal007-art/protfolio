name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Claude Code review
        uses: anthropics/claude-code-action@v1
        with:
          # Value must be your OpenRouter key (sk-or-v1-...)
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          use_sticky_comment: true
          prompt: |
            Review this pull request for a portfolio site (HTML, CSS, JavaScript).
            Focus on:
            1. Security (hardcoded secrets, XSS, unsafe innerHTML, leaking form data)
            2. Missing null checks / runtime crashes
            3. Accessibility and placeholder links (href="#")
            For each finding: file, severity (critical/high/medium/low), short explanation, suggested fix.
            Write your review as your final response — do not use any tool to post it yourself.
            It will be posted automatically as a PR comment.
          claude_args: |
            --max-turns 10
        env:
          # y-router: translates Anthropic-format requests to OpenAI-format
          # so non-Anthropic free models work with Claude Code
          ANTHROPIC_BASE_URL: https://cc.yovy.app
          ANTHROPIC_MODEL: nvidia/nemotron-3-super-120b-a12b:free
          ANTHROPIC_SMALL_FAST_MODEL: nvidia/nemotron-3-super-120b-a12b:free
